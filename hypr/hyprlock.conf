#!/bin/zsh

background {
    monitor =
    path = /home/tathya/wallpaper/goku-perfected-3840x2160-25454.jpg
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Lock Icon
label {
    monitor =
    text = 󰌾
    color = rgba(255, 255, 255, 0.65)
    font_size = 60
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 240
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.8)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 110
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.7)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hello, $USER
    color = rgba(255, 255, 255, 0.6)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i><span foreground="##ffffff99">Enter Password</span></i>
    hide_input = false
    rounding = -1 # Circle
    check_color = rgba(255, 255, 255, 0.2)
    fail_color = rgba(255, 0, 0, 0.2)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -120
    halign = center
    valign = center
}
