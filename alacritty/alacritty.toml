[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.bold]
family = "CaskaydiaCove Nerd Font"
style = "Bold"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font"
style = "Bold Italic"

[font.italic]
family = "CaskaydiaCove Nerd Font"
style = "Italic"

[font.normal]
family = "CaskaydiaCove Nerd Font"
style = "Regular"

[window]
blur = true
opacity = 0.8
padding.x = 15
padding.y = 15

# --- Colors, defined directly -- no imported theme ---

[colors.primary]
background = "#140a0a"
foreground = "#EDE0C8"

[colors.cursor]
cursor = "#E4181E"
text = "#140a0a"

[colors.normal]
black   = "#241010"
red     = "#FF1E1E"
green   = "#4CD07D"
yellow  = "#FFC94D"
blue    = "#5AA9E6"
magenta = "#E85DB0"
cyan    = "#4DD9E0"
white   = "#F3E7CE"

[colors.bright]
black   = "#8a7568"
red     = "#FF4747"
green   = "#7CFFA0"
yellow  = "#FFE08A"
blue    = "#8FC7FF"
magenta = "#FF8FD0"
cyan    = "#8FF0F5"
white   = "#FFFFFF"
