$terminal = alacritty
$fileManager = nautilus
$menu = rofi -show drun
$browser = brave
$editor = code
$wifi = wifimenu
$notes = obsidian

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, X, killactive,
#bind = $mainMod, M, exit, exit hyprland
bind = $mainMod, W, exec, $wifi
bind = $mainMod SHIFT, B, exec, rofi-bluetooth
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, Space, exec, $menu
bind = $mainMod, T, pseudo, # dwindle Toggle TileView
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, B, exec, $browser
bind = $mainMod, R, exec, ~/.config/waybar/scripts/launch.sh
bind = $mainMod SHIFT, T, exec, ~/.config/waybar/scripts/theme-selector.sh
bind = $mainMod, K, exec, killall waybar
bind = $mainMod, C, exec, $editor
bind = $mainMod, N, exec, ~/.config/hypr/scripts/toggle-night-mode.sh
bind = $mainMod, plus, exec, hyprctl hyprsunset temperature +500
bind = $mainMod, minus,exec, hyprctl hyprsunset temperature -500

bind = $mainMod SHIFT, E, exec, rofi -show emoji
bind = $mainMod SHIFT, C, exec, rofi -show calc -no-show-match -no-sort

bind = $mainMod SHIFT, W, exec, ~/.config/waypaper/select_wallpaper.sh

bind = $mainMod SHIFT, N, exec, $notes

bind = $mainMod ALT, S, exec, hyprshot -m region
bind = $mainMod ALT SHIFT, S, exec, hyprshot -m window

bind = $mainMod CTRL, left, movefocus, l
bind = $mainMod CTRL, right, movefocus, r
bind = $mainMod CTRL, up, movefocus, u
bind = $mainMod CTRL, down, movefocus, d

bind = $mainMod CTRL, l, movefocus, l
bind = $mainMod CTRL, h, movefocus, r
bind = $mainMod CTRL, k, movefocus, u
bind = $mainMod CTRL, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, H, togglespecialworkspace, magic
#bind = $mainMod SHIFT, H, movetoworkspace, special:magic

bind = $mainMod , Right, workspace , m+1
bind = $mainMod , Left, workspace , m-1

bind = $mainMod , l, workspace , m+1
bind = $mainMod , h, workspace , m-1

bind = $mainMod SHIFT, Right, movetoworkspace , m+1
bind = $mainMod SHIFT, Left, movetoworkspace , m-1

bind = $mainMod SHIFT, h, movetoworkspace , m+1
bind = $mainMod SHIFT, l, movetoworkspace , m-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

#Power Options

bind = $mainMod CTRL ALT,p, exec, shutdown now
bind = $mainMod,M , exec, hyprlock
bind = $mainMod CTRL ALT, L, exec, systemctl suspend 
bind = $mainMod CTRL ALT, R, exec, reboot

